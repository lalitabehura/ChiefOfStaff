# Production-style stack. Put a TLS-terminating proxy (Caddy, Traefik, a cloud load balancer)
# in front of the `web` service; the app expects HTTPS in production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chiefofstaff
      POSTGRES_USER: chiefofstaff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chiefofstaff"]
      interval: 5s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    networks: [internal]
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://chiefofstaff:${POSTGRES_PASSWORD}@db:5432/chiefofstaff
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      FORWARDED_ALLOW_IPS: "*"   # only reachable from the internal network via nginx
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://chiefofstaff:${POSTGRES_PASSWORD}@db:5432/chiefofstaff
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on: [backend]
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  web:
    build: ./frontend
    ports: ["8080:8080"]
    depends_on: [backend]
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

networks:
  internal:
